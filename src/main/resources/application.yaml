server:
  port: 8050
  shutdown: "graceful"

management:
  endpoint:
    health:
      show-details: "always"
  endpoints:
    web:
      base-path: /
      exposure:
        include: health, info, prometheus

fact:
  url: ${FACT_API_URL:http://localhost:8080}
  endpoint:
    all-court-data: /search/results.json?q=

factdata:
  url: ${FACT_DATA_API_URL:http://localhost:8989}
  endpoint:
    create-and-upload-csv: /csv/

spring:
  config:
    import: "optional:configtree:/mnt/secrets/fact/"
  application:
    name: FACT Cron Trigger
  cloud:
    azure:
      active-directory:
        enabled: true
        profile:
          tenant-id: ${AZURE_TENANT_ID:}
        credential:
          client-id: ${AZURE_CLIENT_ID:}
          client-secret: ${CLIENT_SECRET:}
        app-id-uri: ${FACT_DATA_API_URL}
        authorization-clients:
          factDataApi:
            authorization-grant-type: client_credentials
            scopes:
              - "api://${API_APP_REG_ID:}/.default"

azure:
  blob:
    connection-string: ${STORAGE_ACCOUNT_CONNECTION_STRING:DefaultEndpointsProtocol=http;AccountName=factlocal;AccountKey=cmVmb3Jtc2NhbmtleQo=;BlobEndpoint=http://localhost:10000/factlocal;}
